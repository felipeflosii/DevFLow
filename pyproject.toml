[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-ado"
version = "0.6.0"
description = "CLI para Azure Boards, Azure Repos e Git: tarefas, hierarquia, branches e PRs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CitizenTech"}]
dependencies = []

[project.scripts]
dev = "devflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
